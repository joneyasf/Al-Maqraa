name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.32.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --template=app --platforms=android --project-name maqraa --org com.liwajhullah /tmp/maqraa-scaffold
            cp /tmp/maqraa-scaffold/android/gradlew android/gradlew
            cp /tmp/maqraa-scaffold/android/gradlew.bat android/gradlew.bat
            cp -r /tmp/maqraa-scaffold/android/gradle android/gradle
            chmod +x android/gradlew
          fi

      - name: Generate app icons
        run: python3 tools/generate_icons.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
